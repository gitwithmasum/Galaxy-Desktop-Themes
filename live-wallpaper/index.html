<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masum Galaxy • 12 Worlds</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#030612}body{position:relative}.scene{position:absolute;inset:-2%;background-position:center;background-size:cover;opacity:0;transform:scale(1.025);transition:opacity 1.25s ease;will-change:opacity,transform}.scene.active{opacity:1;animation:drift 12s ease-in-out alternate infinite}@keyframes drift{from{transform:scale(1.025) translate3d(0,0,0)}to{transform:scale(1.095) translate3d(-.5%,.3%,0)}}#shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(1,5,20,.12),transparent 55%),linear-gradient(0deg,rgba(2,5,20,.15),transparent 35%);pointer-events:none}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#badge{position:absolute;bottom:42px;left:50px;font:600 11px/1.5 system-ui,sans-serif;letter-spacing:.3em;color:rgba(204,231,255,.66);text-shadow:0 2px 12px #0009;pointer-events:none}#badge b{display:block;color:#b3eaff;font-size:15px;letter-spacing:.18em;margin-bottom:3px}@media(max-width:700px){#badge{left:24px;bottom:24px}}@media(prefers-reduced-motion:reduce){.scene.active{animation:none}.scene{transition:none}canvas{display:none}}
</style></head><body><div id="a" class="scene active"></div><div id="b" class="scene"></div><div id="shade"></div><canvas id="stars"></canvas><div id="badge"><b>MASUM BILLAH</b><span id="label">01 / 12 · MOON</span></div>
<script>
'use strict';
const scenes=[['MOON','scenes/01-moon.jpg'],['EARTH ORBIT','scenes/02-earth-orbit.jpg'],['MERCURY','scenes/03-mercury.jpg'],['VENUS','scenes/04-venus.jpg'],['EARTH','scenes/05-earth-planet.jpg'],['MARS','scenes/06-mars.jpg'],['JUPITER','scenes/07-jupiter.jpg'],['SATURN','scenes/08-saturn.jpg'],['URANUS','scenes/09-uranus.jpg'],['NEPTUNE','scenes/10-neptune.jpg'],['SUN','scenes/11-sun.jpg'],['SATELLITE','scenes/12-satellite.jpg']];
let index=0,front=document.querySelector('#a'),back=document.querySelector('#b');front.style.backgroundImage=`url("${scenes[0][1]}")`;
function advance(){const next=(index+1)%scenes.length,img=new Image();img.onload=()=>{back.style.backgroundImage=`url("${img.src}")`;back.classList.add('active');front.classList.remove('active');[front,back]=[back,front];index=next;document.querySelector('#label').textContent=`${String(index+1).padStart(2,'0')} / 12 · ${scenes[index][0]}`;new Image().src=scenes[(index+1)%scenes.length][1]};img.src=scenes[next][1]}
new Image().src=scenes[1][1];let timer=setInterval(advance,5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(timer);timer=0}else if(!timer){timer=setInterval(advance,5000)}});
const canvas=document.querySelector('#stars'),ctx=canvas.getContext('2d');let w=0,h=0,dpr=1,particles=[];
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);w=window.innerWidth;h=window.innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);particles=Array.from({length:Math.min(115,Math.ceil(w*h/17500))},()=>({x:Math.random()*w,y:Math.random()*h,r:.35+Math.random()*1.25,v:.05+Math.random()*.22,a:.16+Math.random()*.55,p:Math.random()*6.28}))}window.addEventListener('resize',resize);resize();
function frame(t){if(!document.hidden&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){ctx.clearRect(0,0,w,h);for(const s of particles){s.y-=s.v;if(s.y<-3){s.y=h+3;s.x=Math.random()*w}const a=s.a*(.78+.22*Math.sin(t*.0015+s.p));ctx.fillStyle=`rgba(185,222,255,${a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
