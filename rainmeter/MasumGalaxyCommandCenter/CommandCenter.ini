; MASUM GALAXY COMMAND CENTER
; Rainmeter native skin. Change items in [Variables], save and Refresh skin.
; Weather is set to Dhaka until you change coordinates and city.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!SetWindowPosition "24" "80"][!ZPos 0]

[Variables]
Name=MASUM BILLAH
City=DHAKA
Latitude=23.8103
Longitude=90.4125
LinkGitHub=https://github.com/gitwithmasum
LinkProjects=https://github.com/gitwithmasum/Galaxy-Desktop-Themes
LinkChatGPT=https://chatgpt.com/
LinkFiles=explorer.exe
PanelWidth=420
PanelHeight=438
Cyan=102,232,255,255
Muted=149,173,206,255

[MeasureClock]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A, %d %B %Y

[MeasureCPU]
Measure=CPU
Processor=0
MinValue=0
MaxValue=100

[MeasureRAM]
Measure=PhysicalMemory

[MeasureBattery]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent
UpdateDivider=10

[MeasureWeatherRaw]
Measure=WebParser
URL=https://api.open-meteo.com/v1/forecast?latitude=#Latitude#&longitude=#Longitude#&current=temperature_2m&timezone=auto
RegExp=(?si)"temperature_2m":\s*(-?[0-9]+(?:\.[0-9]+)?)
UpdateRate=900
DynamicVariables=1

[MeasureWeatherTemp]
Measure=WebParser
URL=[MeasureWeatherRaw]
StringIndex=1

[Panel]
Meter=Shape
Shape=Rectangle 1,1,418,436,20 | Fill Color 7,13,35,234 | StrokeWidth 1.5 | Stroke Color 82,183,246,154
Shape2=Rectangle 16,17,3,31,1 | Fill Color 103,236,255,240 | StrokeWidth 0
Shape3=Rectangle 27,126,365,1 | Fill Color 101,200,255,77 | StrokeWidth 0
Shape4=Rectangle 27,228,365,1 | Fill Color 101,200,255,70 | StrokeWidth 0
Shape5=Rectangle 27,345,365,1 | Fill Color 101,200,255,70 | StrokeWidth 0
Shape6=Ellipse 381,28,2.5,2.5 | Fill Color 110,247,255,234 | StrokeWidth 0
Shape7=Ellipse 389,36,1.3,1.3 | Fill Color 196,143,255,180 | StrokeWidth 0
Shape8=Rectangle 1,1,418,436,20 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color 169,111,255,46

[Header]
Meter=String
X=29
Y=18
FontFace=Consolas
FontSize=10
FontWeight=700
FontColor=#Cyan#
AntiAlias=1
Text=GALAXY  /  COMMAND CENTER

[HeaderSub]
Meter=String
X=29
Y=42
FontFace=Consolas
FontSize=8
FontColor=#Muted#
AntiAlias=1
Text=#Name#  //  PERSONAL DESKTOP
DynamicVariables=1

[Time]
Meter=String
MeasureName=MeasureClock
X=27
Y=62
FontFace=Segoe UI Light
FontSize=40
FontColor=223,244,255,255
AntiAlias=1
