; MASUM GALAXY TASKBAR STARS - Rainmeter skin
; Designed for a bottom Windows 11 taskbar; keep your Windhawk theme enabled.
; Change NameText below, save, then Refresh skin to change the label.

[Rainmeter]
Update=120
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!SetWindowPosition "0" "0B" "0" "0B"][!ZPos 2][!ClickThrough 1][!Draggable 0]

[Variables]
NameText=MASUM BILLAH
BarHeight=48

[MeterBounds]
Meter=Shape
Shape=Rectangle 0,0,#SCREENAREAWIDTH#,#BarHeight# | Fill Color 0,0,0,1 | StrokeWidth 0
DynamicVariables=1

[MeterNameAccent]
Meter=Shape
X=16
Y=17
Shape=Ellipse 0,0,2.2,2.2 | Fill Color 106,238,255,215 | StrokeWidth 0
Shape2=Rectangle 0,21,128,1 | Fill Color 92,219,255,98 | StrokeWidth 0

[MeterName]
Meter=String
X=28
Y=12
Text=#NameText#
FontFace=Consolas
FontSize=9
FontWeight=700
FontColor=182,248,255,240
AntiAlias=1
DynamicVariables=1

[MeterNameMicro]
Meter=String
X=160
Y=16
Text=//
FontFace=Consolas
FontSize=7
FontColor=143,105,255,145
AntiAlias=1

